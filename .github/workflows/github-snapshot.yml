name: Refresh GitHub activity snapshot

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the portfolio
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate the snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: NMasters52
        run: npm run github:snapshot

      - name: Commit a changed snapshot
        run: |
          if git diff --quiet -- src/data/github-snapshot.json; then
            echo "Snapshot is unchanged."
            exit 0
          fi
          backup_path="$(mktemp)"
          git show HEAD:src/data/github-snapshot.json > "$backup_path"
          cleanup() {
            if [[ "$?" -ne 0 ]]; then
              cp "$backup_path" src/data/github-snapshot.json
            fi
            rm -f "$backup_path"
          }
          trap cleanup EXIT
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-snapshot.json
          git commit -m "Refresh GitHub activity snapshot"
          git push
